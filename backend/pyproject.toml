[project]
name = "legalthink-api"
version = "0.1.0"
description = "LegalThink document review API with source-linked analysis"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.161,<1",
  "uvicorn[standard]>=0.54,<1",
  "openai>=3.37,<4",
  "pydantic>=2.14.1,<3",
  "python-multipart>=0.0.32,<1",
  "python-dotenv>=1.2.4,<2",
  "pypdf>=6.21.2,<7",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "httpx2>=2.16,<3",
  "pytest>=9.1.1,<10",
  "pytest-asyncio>=1.4,<2",
  "ruff>=0.17.2,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
