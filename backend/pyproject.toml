[project]
name = "legalthink-api"
version = "0.3.0"
description = "LegalThink document review API with source-linked analysis"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.162.5,<1",
  "uvicorn[standard]>=0.54,<1",
  "openai>=3.49,<4",
  "pydantic>=2.14.3,<3",
  "python-multipart>=0.0.33,<1",
  "python-dotenv>=1.2.4,<2",
  "pypdf>=6.21.4,<8",
  "python-docx>=1.2,<2",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28.1,<1",
  "httpx2>=2.16,<3",
  "pytest>=9.2.0,<10",
  "pytest-asyncio>=1.4.1,<2",
  "ruff>=0.17.3,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
