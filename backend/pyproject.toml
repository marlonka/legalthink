[project]
name = "legalthinkgpt-api"
version = "0.1.0"
description = "Local legal document workspace with evidence-linked OpenAI analysis"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
  "openai>=2.0,<3",
  "pydantic>=2.10,<3",
  "python-multipart>=0.0.20,<1",
  "python-dotenv>=1.1,<2",
  "pypdf>=6.19,<7",
  "python-docx>=1.2,<2",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=1,<2", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
