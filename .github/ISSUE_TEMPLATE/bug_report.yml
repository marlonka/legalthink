name: Fehler melden
description: Reproduzierbaren Fehler in LegalThink beschreiben.
body:
  - type: markdown
    attributes:
      value: Issues sind öffentlich. Verwende synthetische Beispiele. Keine Mandatsdaten, API-Schlüssel, `.env`-Dateien, Datenbanken oder vollständigen API-Anfragen hochladen.
  - type: textarea
    id: behavior
    attributes:
      label: Erwartetes und tatsächliches Verhalten
      description: Was sollte passieren, was passiert stattdessen?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Schritte zum Reproduzieren
      description: Prüfungsart, Eingaben und Klickfolge; Dateibeispiele nur mit erfundenen Inhalten.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Umgebung
      description: Commit oder Version, Betriebssystem und Browser; Entwicklungsserver oder gebauter Stand. Bei Analysefehlern auch Modell-ID, Denkstufe, Region, Standard/Flex und Webrecherche angeben.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Fehlermeldung oder Screenshot
      description: Wortlaut der Fehlermeldung; falls vorhanden HTTP-Status. Screenshots mit synthetischen Daten nachstellen. Keine vollständigen Providerantworten oder Netzwerk-Mitschnitte anhängen.
